# 원본 가격표가 아닌 개발용 임시 값 (골드). 변경 후 서버 재시작.
# 판매가는 interval-minutes마다 변동합니다. 원본은 10분 주기와 상/하한이 있다는 것만 확인되었고
# 상/하한 수치와 변동 산식은 미확인입니다.
market:
  interval-minutes: 10
  min-percent: 50
  max-percent: 180
  # 매 회차 전체 범위에서 독립 무작위 추첨. 서버 전체 품목별 판매량을 합산합니다.
  volume-threshold: 256
  pressure-per-batch: 10
  max-pressure: 60
  # 끝난 회차 통계 파일(stats/round-번호.yml)의 보관 기간. 지나면 자동 삭제됩니다.
  stats-keep-days: 30
  # 관리자 판매는 통계에서 유저와 따로 집계합니다. false면 다음 시세 하락 압력에서도 뺍니다.
  admin-sales-move-price: true
# 농산물 상인이 사들이는 작물. base: 기준가, swing: 이전 버전 호환 필드(현재 추첨에서 미사용), category: 상점 탭
