# 원본 가격표가 아닌 개발용 임시 값 (YD). 변경 후 서버 재시작.
# 판매가는 interval-minutes마다 변동합니다. 원본은 10분 주기와 상/하한이 있다는 것만 확인되었고
# 상/하한 수치와 변동 산식은 미확인입니다.
market:
  interval-minutes: 10
  min-percent: 50
  max-percent: 180
# 농산물 상인이 사들이는 작물. base: 기준가, swing: 1회 변동 폭(%), category: 상점 탭
crops:
  WHEAT: {base: 8, swing: 5, category: 곡물·채소}
  CARROT: {base: 5, swing: 6, category: 곡물·채소}
  POTATO: {base: 5, swing: 6, category: 곡물·채소}
  BEETROOT: {base: 10, swing: 7, category: 곡물·채소}
  PUMPKIN: {base: 18, swing: 8, category: 곡물·채소}
  MELON_SLICE: {base: 3, swing: 10, category: 과일·열매}
  SWEET_BERRIES: {base: 4, swing: 9, category: 과일·열매}
  GLOW_BERRIES: {base: 7, swing: 10, category: 과일·열매}
  COCOA_BEANS: {base: 9, swing: 10, category: 과일·열매}
  SUGAR_CANE: {base: 6, swing: 8, category: 특수 작물}
  CACTUS: {base: 6, swing: 8, category: 특수 작물}
  BAMBOO: {base: 2, swing: 10, category: 특수 작물}
  KELP: {base: 3, swing: 10, category: 특수 작물}
  BROWN_MUSHROOM: {base: 6, swing: 12, category: 특수 작물}
  RED_MUSHROOM: {base: 8, swing: 12, category: 특수 작물}
  NETHER_WART: {base: 14, swing: 12, category: 특수 작물}
  TORCHFLOWER: {base: 40, swing: 15, category: 특수 작물}
  PITCHER_PLANT: {base: 60, swing: 15, category: 특수 작물}
# 씨앗 상인이 파는 품목. price: 고정 구매가. crops에도 있는 품목은 최고 시세보다 비싸야 합니다.
seeds:
  WHEAT_SEEDS: {price: 2, category: 씨앗}
  BEETROOT_SEEDS: {price: 3, category: 씨앗}
  MELON_SEEDS: {price: 8, category: 씨앗}
  PUMPKIN_SEEDS: {price: 8, category: 씨앗}
  TORCHFLOWER_SEEDS: {price: 100, category: 씨앗}
  PITCHER_POD: {price: 150, category: 씨앗}
  CARROT: {price: 20, category: 모종}
  POTATO: {price: 20, category: 모종}
  SUGAR_CANE: {price: 25, category: 모종}
  CACTUS: {price: 25, category: 모종}
  BAMBOO: {price: 10, category: 모종}
  KELP: {price: 10, category: 모종}
  SWEET_BERRIES: {price: 15, category: 모종}
  GLOW_BERRIES: {price: 25, category: 모종}
  COCOA_BEANS: {price: 35, category: 모종}
  BROWN_MUSHROOM: {price: 25, category: 모종}
  RED_MUSHROOM: {price: 30, category: 모종}
  NETHER_WART: {price: 50, category: 모종}
  BONE_MEAL: {price: 5, category: 농기구}
  STONE_HOE: {price: 30, category: 농기구}
  IRON_HOE: {price: 120, category: 농기구}
# 바닐라에 없는 작물. 배추·파인애플·포도는 원본 언급이 있고 나머지 품목과 모든 수치는 개발용 값입니다.
# 씨앗은 씨앗 상인이 팔고, 경작지에 심습니다. chunk-limit은 원본의 청크당 100개 표기를 따릅니다.
custom-crops:
  chunk-limit: 100
  crops:
    CABBAGE: {name: 배추, seed-name: 배추 씨앗, base: 24, swing: 9, seed-price: 12, grow-minutes: 15, yield: [1, 3]}
    TOMATO: {name: 토마토, seed-name: 토마토 씨앗, base: 30, swing: 10, seed-price: 15, grow-minutes: 20, yield: [1, 3]}
    CORN: {name: 옥수수, seed-name: 옥수수 씨앗, base: 34, swing: 9, seed-price: 18, grow-minutes: 25, yield: [1, 3]}
    STRAWBERRY: {name: 딸기, seed-name: 딸기 모종, base: 42, swing: 12, seed-price: 24, grow-minutes: 30, yield: [1, 3]}
    GRAPE: {name: 포도, seed-name: 포도 묘목, base: 55, swing: 12, seed-price: 32, grow-minutes: 40, yield: [1, 2]}
    PINEAPPLE: {name: 파인애플, seed-name: 파인애플 모종, base: 80, swing: 14, seed-price: 48, grow-minutes: 60, yield: [1, 2]}
# 수집 도감. 원본은 300개 규모이며 등록 방식은 미확인이라 아이템 1개를 제출하는 방식으로 구현했습니다.
dex:
  pages:
    농사: [WHEAT, CARROT, POTATO, BEETROOT, PUMPKIN, MELON_SLICE, SWEET_BERRIES, GLOW_BERRIES, COCOA_BEANS, SUGAR_CANE, CACTUS, BAMBOO, KELP, BROWN_MUSHROOM, RED_MUSHROOM, NETHER_WART, TORCHFLOWER, PITCHER_PLANT]
    채광: [COBBLESTONE, COAL, RAW_IRON, RAW_COPPER, RAW_GOLD, REDSTONE, LAPIS_LAZULI, DIAMOND, EMERALD, QUARTZ, AMETHYST_SHARD, OBSIDIAN, FLINT, CLAY_BALL, GLOWSTONE_DUST, NETHERRACK, END_STONE, ANCIENT_DEBRIS]
    사냥: [ROTTEN_FLESH, BONE, STRING, SPIDER_EYE, GUNPOWDER, ENDER_PEARL, BLAZE_ROD, SLIME_BALL, LEATHER, FEATHER, EGG, WHITE_WOOL, BEEF, PORKCHOP, CHICKEN, MUTTON, RABBIT, PHANTOM_MEMBRANE]
    바다·요리: [COD, SALMON, TROPICAL_FISH, PUFFERFISH, NAUTILUS_SHELL, INK_SAC, PRISMARINE_SHARD, BREAD, BAKED_POTATO, COOKED_BEEF, COOKED_PORKCHOP, COOKED_CHICKEN, PUMPKIN_PIE, COOKIE, CAKE, MUSHROOM_STEW, BEETROOT_SOUP, GOLDEN_CARROT]
  # 달성 개수별 보상. 원본의 10/20/30/50개 구간과 30개 땅 구매 이용권은 따르고, 띵코인은 미구현이라 YD로 대체했습니다.
  rewards:
    10: {coins: 500}
    20: {coins: 1500}
    30: {coins: 3000, land-permit: true}
    50: {coins: 10000}
    72: {coins: 30000}
# 청크 단위 땅. 최대 9개는 원본 기준이고, 가격은 미확인이라 개발용 값입니다.
# n번째 땅 가격 = price + step × (이미 보유한 땅 수)
land:
  price: 5000
  step: 2500
  max: 9
  # 발자국을 신고할 수 있는 기간(일). 원본 수치는 미확인이라 개발용 값입니다.
  report-days: 7
# 상점 화면용 리소스팩을 내려받는 주소. 다른 사람이 접속하는 서버라면 host를 공인 주소로 바꾸고 포트를 여세요.
pack:
  host: 127.0.0.1
  port: 25580
village:
  # true면 서버 첫 실행 때 월드 스폰 주변 약 110칸 사방을 평탄화해 마을을 짓습니다.
  # 기본값은 기존 월드를 보존하기 위해 false입니다. 마을은 /tycoon village build confirm 으로 짓습니다.
  auto-build: false
