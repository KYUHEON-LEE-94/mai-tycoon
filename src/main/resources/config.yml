    10: {coins: 500, zcoin: 1}
    20: {coins: 1500, zcoin: 5, lamp: 1}
    30: {coins: 3000, zcoin: 5, land-permit: true}
    50: {coins: 10000, zcoin: 10}
    72: {coins: 30000, zcoin: 20}
    100: {coins: 50000, zcoin: 20}
