name: MaiTycoon
version: 0.19.1
main: kr.maitycoon.MaiTycoonPlugin
api-version: '1.21.11'
description: 농사로 시작하는 생활 타이쿤
commands:
  tycoon:
    description: 타이쿤 정보, 시세, 도감, 땅
    aliases: [타이쿤]
    usage: /tycoon [help|info|starter|price|wallet|village|dex|land|lamp|autoplant]
    permission: maitycoon.play
  도움말:
    description: 단축키와 기능 안내
    aliases: [guide, 안내]
    permission: maitycoon.play
permissions:
  maitycoon.play:
    default: true
  maitycoon.admin:
    description: 보호 무시, 이용권과 한도 무시, 재화 지급, 모든 관리 명령
    default: op
