name: MaiTycoon
version: 0.13.3
main: kr.maitycoon.MaiTycoonPlugin
api-version: '1.21.11'
description: 농사로 시작하는 생활 타이쿤
commands:
  tycoon:
    description: 타이쿤 정보, 시세, 도감, 땅
    aliases: [타이쿤]
    usage: /tycoon [help|info|starter|price|village|dex|land]
    permission: maitycoon.play
permissions:
  maitycoon.play:
    default: true
  maitycoon.admin:
    description: 보호 무시, 이용권과 한도 무시, 재화 지급, 모든 관리 명령
    default: op
